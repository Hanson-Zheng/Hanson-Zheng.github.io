<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico?v=zym-3" sizes="16x16 32x32 48x48 64x64 128x128 256x256">
    <link rel="icon" href="favicon.svg?v=zym-3" type="image/svg+xml" sizes="any">
    <title>Highlights | Hanson Zheng</title>
    <link rel="stylesheet" href="assets/fonts/inter/inter.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/publications.css">
    <link rel="stylesheet" href="css/highlights.css">
    <link rel="stylesheet" href="css/collections.css">
    <link rel="stylesheet" href="css/cards.css">
    <link rel="stylesheet" href="assets/vendor/fontawesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo" aria-label="Yumin's Site - Home" title="Yumin's Site - Home"><span class="logo-mark" aria-hidden="true"></span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="projects.html" data-section="projects">Projects</a></li>
                <li><a href="highlights.html" class="active">Highlights</a></li>
                <li><a href="life.html">Life</a></li>
                <li><a href="#contact" class="nav-contact" aria-label="Jump to contact section">Contact <i class="fas fa-arrow-down" aria-hidden="true"></i></a></li>
            </ul>
            <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <main class="container section-padding collection-page">
        <h1 class="section-title">Highlights</h1>
        
        <div class="highlights-toolbar collection-year-toolbar">
            <div id="highlights-filter" class="filter-container" aria-label="Highlight years"></div>
            <div class="highlights-view-switch" id="highlights-view-switch" role="group" aria-label="Reading view" hidden>
                <button type="button" class="highlights-view-button" data-highlights-view="cards" aria-label="Card view" title="Card view" aria-pressed="true" aria-controls="highlights-list">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/><rect x="3" y="12" width="5" height="5" rx="1"/><rect x="12" y="12" width="5" height="5" rx="1"/></svg>
                    <span>Cards</span>
                </button>
                <button type="button" class="highlights-view-button" data-highlights-view="list" aria-label="List view" title="List view" aria-pressed="false" aria-controls="highlights-list">
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M7 5H17M7 10H17M7 15H17M3 5H3.01M3 10H3.01M3 15H3.01"/></svg>
                    <span>List</span>
                </button>
            </div>
        </div>

        <!-- Highlights Grid -->
        <div class="highlights-grid" id="highlights-list">
            <!-- JS will populate News here -->
            <div class="loading">Loading news...</div>
        </div>
    </main>

    <!-- Contact Section -->
    <section id="contact" class="section-padding bg-light">
        <div class="container">
            <h2 class="section-title">Contact</h2>
            <div class="contact-box">
                <p>Feel free to reach out for collaborations or just a chat.</p>
                <a href="#" class="email-link" id="contact-email">Loading...</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container footer-content">
            <p id="footer-text"></p>
        </div>
    </footer>

    <script src="data/config.js"></script>
    <script src="data/highlights.js"></script>
    <script src="assets/images/card-images.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
