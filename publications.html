<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | Hanson Zheng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/publications.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Yumin's Site</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="publications.html" class="active">Publications</a></li>
                <li><a href="highlights.html">Highlights</a></li>
                <li><a href="life.html">Life</a></li>
                <li><a href="#contact" class="nav-contact" aria-label="Jump to contact section">Contact <i class="fas fa-arrow-down" aria-hidden="true"></i></a></li>
            </ul>
            <div class="mobile-menu-btn"><i class="fas fa-bars"></i></div>
        </div>
    </nav>

    <main class="container section-padding publications-page">
        <h2 class="section-title">Publications</h2>
        
        <div class="pub-layout">
            <!-- Sidebar Bookmarks -->
            <aside class="pub-sidebar">
                <div class="sticky-wrapper">
                    <form class="pub-search" role="search" aria-label="Search publications" hidden>
                        <label for="publication-search">Search</label>
                        <div class="pub-search-field">
                            <svg class="pub-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
                            <input type="search" id="publication-search" placeholder="Keywords…" aria-describedby="publication-search-help" aria-controls="pub-list" autocomplete="off" spellcheck="false" enterkeyhint="search" maxlength="200">
                            <button type="button" class="pub-search-clear" id="publication-search-clear" aria-label="Clear search" hidden>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
                            </button>
                        </div>
                        <!-- <p id="publication-search-help">Titles, authors, venues<br> and abstracts.</p> -->
                    </form>
                    <nav id="publication-years" aria-label="Publication years">
                        <h3>Year</h3>
                        <ul id="year-filters" class="bookmark-list">
                            <!-- JS will populate years here -->
                        </ul>
                    </nav>
                </div>
            </aside>

            <!-- Content -->
            <div class="pub-content">
                <p class="pub-search-status" id="publication-search-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
                <div id="pub-list">
                    <div class="loading">Loading publications...</div>
                </div>
                <div class="pub-search-empty" id="publication-search-empty" hidden>
                    <h3>No matching publications</h3>
                    <p>Try another title, author, venue or keyword.</p>
                    <button type="button" class="pub-search-reset">Clear search</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Contact Section -->
    <section id="contact" class="section-padding bg-light">
        <div class="container">
            <h2 class="section-title">Contact</h2>
            <div class="contact-box">
                <p>Feel free to reach out for collaborations or just a chat.</p>
                <a href="#" class="email-link" id="contact-email">Loading...</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container footer-content">
            <p id="footer-text"></p>
        </div>
    </footer>

    <script src="data/config.js"></script>
    <script src="data/publications.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
