<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanson Zheng | Home</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">Yumin's Site</a>
            <ul class="nav-links">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="publications.html">Publications</a></li>
                <li><a href="highlights.html">Highlights</a></li>
                <li><a href="life.html">Life</a></li>
                <li><a href="#contact" class="nav-contact" aria-label="Jump to contact section">Contact <i class="fas fa-arrow-down" aria-hidden="true"></i></a></li>
            </ul>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="container hero-content">
            <div class="hero-text">
                <h1 id="profile-name">Loading...</h1>
                <p class="subtitle" id="profile-title"></p>
                <div class="intro" id="profile-intro"></div>
                <div class="profile-about" id="profile-about"></div>
                <div class="hero-buttons">
                    <a href="publications.html" class="btn btn-primary">Publications</a>
                    <a href="highlights.html" class="btn btn-secondary">Highlights</a>
                    <div class="social-links" id="social-links">
                        <!-- JS populated -->
                    </div>
                    <div class="project-controls" data-project-controls aria-label="Project carousel controls" hidden>
                        <button type="button" class="project-control" data-project-prev aria-label="Previous project" aria-controls="project-track">&#8592;</button>
                        <button type="button" class="project-control project-playback" data-project-playback aria-label="Pause automatic scrolling" aria-pressed="false" aria-controls="project-track"><span aria-hidden="true">&#10074;&#10074;</span></button>
                        <button type="button" class="project-control" data-project-next aria-label="Next project" aria-controls="project-track">&#8594;</button>
                    </div>
                </div>
                <section class="project-showcase" id="selected-work" aria-label="Projects" aria-roledescription="carousel" hidden>
                    <div class="project-film">
                        <div class="project-viewport" aria-label="Project previews" aria-live="off">
                            <div class="project-track" id="project-track"></div>
                        </div>
                    </div>
                    <div class="project-pagination" aria-label="Choose a project"></div>
                    <p class="project-status visually-hidden" aria-live="polite" aria-atomic="true"></p>
                </section>
                <section class="education" aria-labelledby="education-title">
                    <h2 class="home-section-title" id="education-title">Education</h2>
                    <ol class="education-list" id="profile-education"></ol>
                </section>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section-padding bg-light">
        <div class="container">
            <h2 class="section-title">Contact</h2>
            <div class="contact-box">
                <p>Feel free to reach out for collaborations or just a chat.</p>
                <a href="#" class="email-link" id="contact-email">Loading...</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p id="footer-text"></p>
        </div>
    </footer>

    <!-- Load Data -->
    <script src="data/config.js"></script>
    <script src="data/projects.js"></script>
    <script src="js/project-data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
